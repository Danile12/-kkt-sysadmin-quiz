<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Квиз сисадмина</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--sf:#111a2e;--sf2:#17253f;--line:#25365a;--tx:#e8eefc;--mu:#8ea0c4;--ac:#22d3ee;--ac2:#a3e635;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5fb;--sf:#fff;--sf2:#e8eff9;--line:#cbd7ea;--tx:#0e1a33;--mu:#506080;--ac:#0e7490;--ac2:#3f6212;--bad:#e11d48}}
:root[data-theme="light"]{--bg:#f1f5fb;--sf:#fff;--sf2:#e8eff9;--line:#cbd7ea;--tx:#0e1a33;--mu:#506080;--ac:#0e7490;--ac2:#3f6212;--bad:#e11d48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Manrope,system-ui,sans-serif;background:radial-gradient(circle at 15% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 45%),radial-gradient(circle at 90% 10%,color-mix(in srgb,var(--ac2) 10%,transparent),transparent 40%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.25;mask-image:linear-gradient(#000,transparent 70%)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.top{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px}
.brand{font-family:Unbounded,sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.04em;margin-right:auto}.brand i{color:var(--ac);font-style:normal}
.tab,.ib{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.85rem}
.tab.on{background:var(--ac);color:#04121a;border-color:var(--ac)}
main{position:relative;padding:8px 20px 150px}
.board{display:grid;grid-template-columns:repeat(var(--n),minmax(120px,1fr));gap:10px;overflow-x:auto}
.th{background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;min-height:66px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 clamp(.7rem,1.5vw,.95rem)/1.2 Unbounded,sans-serif;color:var(--ac)}
.cell{aspect-ratio:16/9;border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,var(--sf2),var(--sf));font:700 clamp(1.1rem,3.2vw,2.3rem) Unbounded,sans-serif;color:var(--ac2);transition:.15s}
.cell:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 0 26px -6px var(--ac)}
.cell.used{opacity:.2;pointer-events:none}
.card{max-width:520px;margin:4vh auto;background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:14px;box-shadow:0 20px 60px -30px var(--ac)}
.kick{font:600 .85rem ui-monospace,Menlo,monospace;color:var(--ac2)}
h1{margin:0;font:700 clamp(2rem,8vw,3rem)/1.05 Unbounded,sans-serif}h1 span{color:var(--ac)}
.card p{margin:0;color:var(--mu)}label{display:grid;gap:6px;font-size:.8rem;color:var(--mu)}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.tns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#04121a;border:0;border-radius:12px;padding:14px 20px;font:700 1rem Unbounded,sans-serif}
.fin{max-width:640px;margin:2vh auto;display:grid;gap:10px;text-align:center}.fin h2{font:700 2rem Unbounded,sans-serif;margin:0;color:var(--ac)}.fin p{color:var(--mu);margin:0 0 6px}
.ft{background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:16px;font:600 1.1rem Unbounded,sans-serif}.ft.out{opacity:.25;text-decoration:line-through}
#score{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);overflow-x:auto}
.team{flex:1;min-width:150px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.team.lead{border-color:var(--ac2)}.team b{font-size:.8rem;color:var(--mu);grid-column:1/3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font:700 1.5rem Unbounded,sans-serif;color:var(--ac)}.adj{display:flex;gap:4px}
.adj button{background:var(--sf2);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;font-weight:800}
#modal{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 24px 170px;text-align:center;overflow:auto;background:color-mix(in srgb,var(--bg) 97%,transparent);animation:in .25s}
@keyframes in{from{opacity:0;transform:scale(.97)}}
#mtheme{font:700 .9rem Unbounded,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
#mq{font:600 clamp(1.3rem,3.6vw,2.6rem)/1.3 Unbounded,sans-serif;max-width:1100px}
#ma{border:2px solid var(--ac2);color:var(--ac2);border-radius:14px;padding:14px 24px;font:800 clamp(1.2rem,3vw,2rem) Manrope,sans-serif}
.act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.act button,.aw button{background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-weight:700}
#reveal{background:var(--ac);color:#04121a;border-color:var(--ac)}
#aw{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.aw{display:flex;gap:6px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.aw button.done{opacity:.3;pointer-events:none}.aw .neg{color:var(--bad)}
.rk{display:flex;gap:16px;justify-content:space-between;font:600 1.3rem Unbounded,sans-serif;padding:10px 0;border-bottom:1px solid var(--line);min-width:min(80vw,480px)}.rk:first-child{color:var(--ac2)}
#tm{width:min(80vw,560px);display:grid;gap:6px}#tm div{height:8px;border-radius:8px;background:var(--sf2);overflow:hidden}#tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1s linear}#tm b{font:700 1.4rem Unbounded,sans-serif;color:var(--ac)}#tm.low b{color:var(--bad)}#tm.low i{background:var(--bad)}
#pic{height:clamp(90px,20vh,190px)}#pic svg{height:100%;stroke:var(--ac);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ac) 40%,transparent))}#pic .f{fill:var(--ac2);stroke:none}#pic .k{fill:var(--sf2)}
.brand small{display:block;margin-top:3px;font:600 .7rem Manrope,sans-serif;letter-spacing:0;color:var(--mu)}.card .by{font-size:.85rem;color:var(--ac2)}
.logo{height:46px;width:46px;border-radius:50%;flex:none}.card .logo{height:96px;width:96px;justify-self:center}
.kick b{color:var(--ac);font-weight:600}.cur{display:inline-block;width:.6em;height:1.05em;background:var(--ac2);margin-left:6px;vertical-align:-3px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#mj{max-width:760px;color:var(--mu);font:600 clamp(1rem,2.2vw,1.4rem)/1.35 Manrope,sans-serif;animation:in .3s}#ts{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:40;background:var(--sf);border:1px solid var(--ac);border-radius:12px;padding:10px 18px;font-weight:700;white-space:nowrap;animation:in .25s}
.aw .bet{width:96px;padding:6px 8px;font-weight:700}
#modal{justify-content:safe center}.win{font:700 clamp(1.4rem,4vw,2.6rem)/1.2 Unbounded,sans-serif;color:var(--ac2);margin-bottom:10px}.meme{margin:18px auto 0;width:min(86vw,380px);display:grid;gap:6px;justify-items:center;padding:14px;border-radius:14px;background:linear-gradient(160deg,var(--sf2),var(--sf));border:1px solid var(--line)}.meme b{font:800 clamp(1rem,2.6vw,1.4rem)/1.15 Unbounded,sans-serif;text-transform:uppercase;color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}.meme span{font-size:clamp(4rem,12vw,6rem);line-height:1.1}.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>
<div class="top"><img id="lg" class="logo" alt=""><div class="brand"><span id="bn">Камчатский кооперативный техникум</span> <i>/</i> SYSADMIN QUIZ<small>Автор: Наговицын · группа САО-24-9</small></div><div id="nav" class="act" hidden></div><button class="ib" id="sn">🔊</button><button class="ib" id="fs">⛶</button><button class="ib" id="th">◐</button></div>
<main id="main"></main><div id="score" hidden></div><div id="ts" hidden></div>
<div id="modal" hidden><div id="mtheme"></div><div id="pic" hidden></div><div id="mq"></div><div id="tm" hidden><b></b><div><i></i></div></div><div id="ma" hidden></div><div id="mj" hidden></div><div id="aw"></div><div class="act"><button id="reveal">Показать ответ</button><button id="close">Закрыть</button></div></div>

function tone(f,d,w="sine",v=.15,s=0){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+s;o.type=w;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d)}catch(_){}}

const JOKE={'0-0-0':'Он делает миллиарды операций в секунду и ни разу не просил отпуск.','0-0-1':'ОЗУ как кофе у сисадмина: выключил — и всё забыл.','0-0-2':'На материнской плате всё держится, совсем как в хорошей семье.','0-0-3':'Вставить HDMI не той стороной не получится. Проверено.','0-0-4':'«Оперативная» — не потому, что работает в полиции.','0-1-0':'Единственная система, где перезагрузка решает 90% проблем.','0-1-1':'Почему пингвин? Ему не страшны ни холод, ни вирусы.','0-1-2':'Айфон — когда буква «i» стоит дороже всего остального.','0-1-3':'Правда ли, что андроидам снятся электроовцы? Пока не проверяли.','0-1-4':'Назвал ядро в свою честь. Скромность тоже навык сисадмина.','0-2-0':'Без Wi-Fi современный школьник не проживёт и трёх минут.','0-2-1':'Роутер всегда зависает ровно во время важного созвона.','0-2-2':'127.0.0.1 — дом, милый дом. Нигде не бывает так хорошо, как на localhost.','0-2-3':'Почему «витая»? Не от стресса сисадмина. Хотя и от него тоже.','0-2-4':'Самый короткий разговор в мире: «Ты тут?» — «Тут».','0-3-0':'Компьютерные вирусы лечит антивирус, а настоящие — чай с лимоном.','0-3-1':'Пароль 12345678 — не пароль, а приглашение. Админы плачут.','0-3-2':'Врач для компьютера, только без очереди в поликлинике.','0-3-3':'Письмо «от банка» с тремя ошибками, а вы всё равно кликнули.','0-3-4':'Второй замок: взломщик ленится и уходит к соседям.','0-4-0':'Человек, которого вспоминают только тогда, когда всё сломалось.','0-4-1':'«Выключи и включи снова» — главный инструмент техподдержки.','0-4-2':'Серверы не спят и не едят. Сисадмины спят, но тревожно.','0-4-3':'Холодно, как в зале ожидания, и шумно, как на рок-концерте.','0-4-4':'Есть два вида людей: те, кто делает бэкапы, и те, кто будет.','1-0-0':'USB всегда вставляется с третьей попытки, с какой стороны ни пробуй.','1-0-1':'«Твёрдотельный» — это не «твёрдо стоит на своём».','1-0-2':'LAN-вечеринка: друзья приходят с компьютерами, а не с тортом.','1-0-4':'Раздаёт адреса бесплатно. Щедрее только мама с пирожками.','1-1-0':'Паспортный стол вашего компьютера.','1-1-1':'Две буквы, а делает больше иного отдела.','1-1-2':'cd .. — единственная команда, которая помогает вернуться назад.','1-1-3':'Процессов столько же, сколько дел у сисадмина: все важные, и все горят.','1-1-4':'С root можно всё. С большой силой приходит большая ответственность.','1-2-0':'Первым делом проверьте, включён ли монитор. Так решается 40% вызовов.','1-2-1':'Это не DNS. Не может быть DNS. Это был DNS.','1-2-2':'Пыль в системнике — единственный «ковёр», который вредит процессору.','1-2-3':'Админ не знает ваш пароль, и это его суперсила.','1-2-4':'Один диск сломался, а остальные сделали вид, что ничего не случилось.','1-3-0':'Начал в гараже, а теперь Windows сама решает, когда вам обновляться.','1-3-1':'Яблоко надкусили, чтобы его нельзя было спутать с помидором.','1-3-2':'Благодаря ему мы смотрим котиков круглосуточно.','1-3-3':'А команда git blame покажет, кто виноват. Спойлер: вы.','1-3-4':'Основал мессенджер, в котором у каждого 400 непрочитанных.'},WIN=['Сисадмин одобряет!','Рут-доступ выдан!','Система приняла патч!','Красавчик, +карма!'],LOSE=['Попробуйте перезагрузить мозг','Ошибка 404: ответ не найден','Хм, а бэкап вы делали?','Access denied'],TO=['Время!','Ошибка 408: время вышло','Таймаут. Перезагрузите мозг','Ping не прошёл'],pick=a=>a[Math.random()*a.length|0];let tt;function toast(m){const e=$('#ts');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2200)}
